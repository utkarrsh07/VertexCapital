name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    name: Python tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install scikit-learn yfinance pandas numpy scipy pytest
      - name: Run tests (offline, synthetic data)
        run: python -m pytest tests/test_vertex_screener.py tests/test_vertex_options.py -q
  frontend:
    name: TypeScript check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terminal
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: terminal/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit

